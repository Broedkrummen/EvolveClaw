name: Plugin compatibility
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r server/requirements-dev.txt
      - run: npm run typecheck
      - run: EVOLVECLAW_TEST_PYTHON="$(command -v python)" npm test
      - run: python -m pytest -q
      - run: npx playwright install chromium --only-shell --with-deps
      - run: EVOLVECLAW_TEST_PYTHON="$(command -v python)" npm run test:ui
      - run: npm run verify:package
